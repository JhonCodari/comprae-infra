version: '3.8'

services:
  # ===================
  # INFRAESTRUTURA BASE - DEV
  # ===================
  
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: comprae-postgres-dev
    environment:
      POSTGRES_DB: comprae_dev
      POSTGRES_USER: ${COMPRAE_USER}
      POSTGRES_PASSWORD: ${COMPRAE_PASS}
      POSTGRES_MULTIPLE_DATABASES: comprae_usuarios_dev,comprae_produtos_dev,comprae_categorias_dev,comprae_estoque_dev,comprae_pedidos_dev,comprae_pagamentos_dev,comprae_entregas_dev,comprae_avaliacoes_dev
    ports:
      - "5433:5432"  # Porta diferente para não conflitar
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - comprae-dev-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: comprae-redis-dev
    ports:
      - "6380:6379"  # Porta diferente para não conflitar
    volumes:
      - redis_dev_data:/data
    networks:
      - comprae-dev-network

  # Apache Kafka para desenvolvimento
  zookeeper-dev:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: comprae-zookeeper-dev
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2182"
    volumes:
      - zookeeper_dev_data:/var/lib/zookeeper/data
      - zookeeper_dev_logs:/var/lib/zookeeper/log
    networks:
      - comprae-dev-network

  kafka-dev:
    image: confluentinc/cp-kafka:7.4.0
    container_name: comprae-kafka-dev
    depends_on:
      - zookeeper-dev
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-dev:2182
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-dev:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka_dev_data:/var/lib/kafka/data
    networks:
      - comprae-dev-network

  # Kafka UI para desenvolvimento
  kafka-ui-dev:
    image: provectuslabs/kafka-ui:latest
    container_name: comprae-kafka-ui-dev
    depends_on:
      - kafka-dev
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: comprae-dev-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-dev:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-dev:2182
    networks:
      - comprae-dev-network

  # Elasticsearch para desenvolvimento
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: comprae-elasticsearch-dev
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m  # Menos memória para dev
      - xpack.security.enabled=false
    ports:
      - "9201:9200"  # Porta diferente para não conflitar
    volumes:
      - elasticsearch_dev_data:/usr/share/elasticsearch/data
    networks:
      - comprae-dev-network

  # ===================
  # SERVIÇOS DE APOIO
  # ===================

  # Mailhog para testes de email
  mailhog:
    image: mailhog/mailhog:latest
    container_name: comprae-mailhog-dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - comprae-dev-network

  # Adminer para administração do banco
  adminer:
    image: adminer:latest
    container_name: comprae-adminer-dev
    ports:
      - "8081:8080"
    networks:
      - comprae-dev-network
    depends_on:
      - postgres

networks:
  comprae-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  zookeeper_dev_data:
  zookeeper_dev_logs:
  kafka_dev_data:
  elasticsearch_dev_data:
