version: '3.8'

# Docker Compose para testes e CI/CD
# Versão minimalista focada em testes automatizados

services:
  # ===================
  # INFRAESTRUTURA TESTE
  # ===================
  
  # PostgreSQL para testes
  postgres-test:
    image: postgres:15-alpine
    container_name: comprae-postgres-test
    environment:
      POSTGRES_DB: comprae_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - "5434:5432"
    volumes:
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - comprae-test-network
    tmpfs:
      - /var/lib/postgresql/data  # Em memória para performance

  # Redis para testes
  redis-test:
    image: redis:7-alpine
    container_name: comprae-redis-test
    ports:
      - "6381:6379"
    networks:
      - comprae-test-network
    tmpfs:
      - /data  # Em memória para performance

  # Apache Kafka para testes
  zookeeper-test:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: comprae-zookeeper-test
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - comprae-test-network

  kafka-test:
    image: confluentinc/cp-kafka:7.4.0
    container_name: comprae-kafka-test
    depends_on:
      - zookeeper-test
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-test:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    ports:
      - "9094:29092"
    networks:
      - comprae-test-network

  # ===================
  # SERVIÇOS PARA TESTE
  # ===================

  # Config Server
  config-server-test:
    image: comprae/config-server:test
    container_name: comprae-config-server-test
    ports:
      - "8889:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/JonatasSilvaDev/comprae-config-repo
    networks:
      - comprae-test-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Eureka Server para testes
  eureka-server-test:
    image: comprae/eureka-server:test
    container_name: comprae-eureka-test
    ports:
      - "8762:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_CONFIG_IMPORT=configserver:http://config-server-test:8888
    networks:
      - comprae-test-network
    depends_on:
      - config-server-test
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # User Service para testes
  user-service-test:
    image: comprae/user-service:test
    container_name: comprae-user-service-test
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_CONFIG_IMPORT=configserver:http://config-server-test:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server-test:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-test:5432/comprae_users_test
      - SPRING_DATASOURCE_USERNAME=test_user
      - SPRING_DATASOURCE_PASSWORD=test_pass
      - SPRING_REDIS_HOST=redis-test
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-test:29092
    networks:
      - comprae-test-network
    depends_on:
      - postgres-test
      - redis-test
      - kafka-test
      - config-server-test
      - eureka-server-test

  # Product Service para testes
  product-service-test:
    image: comprae/product-service:test
    container_name: comprae-product-service-test
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_CONFIG_IMPORT=configserver:http://config-server-test:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server-test:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-test:5432/comprae_products_test
      - SPRING_DATASOURCE_USERNAME=test_user
      - SPRING_DATASOURCE_PASSWORD=test_pass
      - SPRING_REDIS_HOST=redis-test
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-test:9092
    networks:
      - comprae-test-network
    depends_on:
      - postgres-test
      - redis-test
      - kafka-test
      - config-server-test
      - eureka-server-test

networks:
  comprae-test-network:
    driver: bridge

# Nota: Volumes não são criados para testes - dados em memória para performance
