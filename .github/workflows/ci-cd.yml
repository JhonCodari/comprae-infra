name: Comprae Infrastructure CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ===================
  # VALIDAÇÃO E LINTING
  # ===================
  
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate Docker Compose files
      run: |
        docker-compose -f docker-compose.yml config
        docker-compose -f docker-compose.dev.yml config
        docker-compose -f docker-compose.test.yml config
        
    - name: Lint Docker Compose files
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: scripts/Dockerfile.*
        failure-threshold: warning
        
    - name: Validate scripts
      run: |
        # Verificar sintaxe dos scripts PowerShell
        pwsh -Command "Get-ChildItem -Path scripts/*.ps1 | ForEach-Object { Get-Content $_.FullName | Out-String | Invoke-Expression -ErrorAction Stop }" || true
        
        # Verificar sintaxe dos scripts bash
        find scripts -name "*.sh" -exec bash -n {} \;

  # ===================
  # TESTES DE INTEGRAÇÃO
  # ===================
  
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
          
    - name: Start test environment
      run: |
        # Criar arquivo .env para testes
        cp .env.example .env
        
        # Iniciar infraestrutura de teste
        docker-compose -f docker-compose.test.yml up -d postgres-test redis-test rabbitmq-test
        
        # Aguardar serviços ficarem prontos
        timeout 60 bash -c 'until docker-compose -f docker-compose.test.yml exec -T postgres-test pg_isready -U test_user; do sleep 1; done'
        timeout 60 bash -c 'until docker-compose -f docker-compose.test.yml exec -T redis-test redis-cli ping; do sleep 1; done'
        
    - name: Run health checks
      run: |
        # Aguardar todos os serviços
        sleep 30
        
        # Verificar serviços básicos
        docker-compose -f docker-compose.test.yml ps
        
        # Executar health checks
        bash scripts/healthcheck.sh postgres-test || echo "PostgreSQL test check"
        bash scripts/healthcheck.sh redis-test || echo "Redis test check"
        
    - name: Cleanup test environment
      if: always()
      run: |
        docker-compose -f docker-compose.test.yml down -v
        docker system prune -f

  # ===================
  # SEGURANÇA E VULNERABILIDADES
  # ===================
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # ===================
  # BUILD E DEPLOY
  # ===================
  
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [validate, integration-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    strategy:
      matrix:
        service: [config-server, eureka-server, api-gateway, user-service, product-service, order-service, payment-service, notification-service]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ../comprae-${{ matrix.service }}
        push: true
        tags: |
          comprae/${{ matrix.service }}:latest
          comprae/${{ matrix.service }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ===================
  # DEPLOY PARA STAGING
  # ===================
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Aqui você adicionaria os comandos para deploy em staging
        # Por exemplo, usando kubectl, docker-compose remoto, etc.
        
    - name: Run smoke tests
      run: |
        echo "Running smoke tests..."
        # Comandos para testes básicos pós-deploy

  # ===================
  # DEPLOY PARA PRODUÇÃO
  # ===================
  
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Aqui você adicionaria os comandos para deploy em produção
        
    - name: Run smoke tests
      run: |
        echo "Running production smoke tests..."
        
    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: "Production deployment completed with status: ${{ job.status }}"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===================
  # LIMPEZA
  # ===================
  
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [build, deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Cleanup old images
      run: |
        echo "Cleaning up old Docker images..."
        # Comandos para limpeza de imagens antigas
