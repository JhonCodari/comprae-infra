services:
  # ===================
  # INFRAESTRUTURA BASE
  # ===================
  
  # PostgreSQL para Config Server
  postgres-config:
    image: postgres:15-alpine
    container_name: comprae-postgres-config
    environment:
      POSTGRES_DB: configdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=pt_BR.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_config_data:/var/lib/postgresql/data
    networks:
      - comprae-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d configdb"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL para Produto Service
  postgres-produto:
    image: postgres:15-alpine
    container_name: comprae-postgres-produto
    environment:
      POSTGRES_DB: comprae_produtos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=pt_BR.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_produto_data:/var/lib/postgresql/data
    networks:
      - comprae-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d comprae_produtos"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: comprae-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - comprae-network
    command: >
      redis-server
      --protected-mode no
      --bind 0.0.0.0
      --timeout 0
      --tcp-keepalive 300
      --maxmemory-policy allkeys-lru
      --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Apache Kafka Message Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: comprae-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - comprae-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: comprae-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - comprae-network
    restart: unless-stopped

  # Kafka UI para gerenciamento
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: comprae-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: comprae-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - comprae-network

  # Elasticsearch for logging and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: comprae-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - comprae-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: comprae-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - comprae-network
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================
  # MICROSERVIÇOS E-COMMERCE
  # ===================

  # Servidor de Configuração
  config-server:
    image: comprae/config-server:latest
    container_name: comprae-config-server
    depends_on:
      - postgres-config
      - redis
      - kafka
    ports:
      - "8080:8080"
    environment:
      # Configurações do banco de dados
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-config:5432/configdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123

      # Configurações do Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      
      # Configurações do Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      
      # Configurações de segurança
      USERNAME: admin
      PASSWORD: admin123

      # Configurações de ambiente
      SPRING_PROFILES_ACTIVE: docker
      
      # Configurações de JVM
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    networks:
      - comprae-network
    restart: unless-stopped


  # Serviço de Produtos
  produto-service:
    build:
      context: ../comprae-produto-service
      dockerfile: Dockerfile
    image: comprae/produto-service:latest
    container_name: comprae-produto-service
    depends_on:
      - postgres-produto
      - config-server
      - redis
      - kafka
    ports:
      - "8081:8082"
    environment:
      # Configurações do banco de dados
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-produto:5432/comprae_produtos
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      
      # Configurações do servidor de configuração
      SPRING_CLOUD_CONFIG_URI: http://config-server:8080
      SPRING_CLOUD_CONFIG_USERNAME: admin
      SPRING_CLOUD_CONFIG_PASSWORD: admin123
      
      # Configurações do Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      
      # Configurações do Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      
      # Configurações de ambiente
      SPRING_PROFILES_ACTIVE: docker
      
      # Configurações de JVM
      JAVA_OPTS: "-Xmx1024m -Xms512m -XX:+UseG1GC"
    networks:
      - comprae-network
    restart: unless-stopped

  # ===================
  # MONITORAMENTO
  # ===================

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: comprae-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - comprae-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: comprae-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${COMPRAE_PASS}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - comprae-network
    depends_on:
      - prometheus

  # Zipkin for distributed tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: comprae-zipkin
    ports:
      - "9411:9411"
    networks:
      - comprae-network

networks:
  comprae-network:
    driver: bridge

volumes:
  postgres_config_data:
  postgres_produto_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
